name: Compat

# Monthly real-profile install verification: install the packed tarball into a
# scratch `dsh` profile, assert the bundle row mounts, and uninstall cleanly.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and pack
        run: |
          pnpm run build
          pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Install into a scratch profile and mount
        run: |
          TARBALL=$(ls "$RUNNER_TEMP"/dsh-defend-*.tgz | head -n1)
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile compat add "$TARBALL"
          dsh --profile compat --dump-config | grep -A1 'id: dsh-defend' | grep 'dsh-defend'

      - name: Uninstall
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile compat remove dsh-defend
